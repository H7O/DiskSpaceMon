# Builds and publishes a GitHub release when a version tag is pushed.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tests run first, so a tag that does not build never becomes a release. Everything runs on
# Windows because that is what DiskSpaceMon targets, and because the tests assert Windows path
# behaviour -- 'C:' and 'C:\' naming one volume is only true there.

name: Release

on:
  push:
    tags:
      - 'v*'

# Needed by 'gh release create'. Nothing else in this workflow writes to the repository.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # v1.2.3 -> 1.2.3, and anything with a hyphen (v1.2.3-beta.1) is published as a prerelease
      # so it does not become the repository's "latest".
      - name: Read the version from the tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=" >> "$GITHUB_OUTPUT"
          fi
          echo "Building $version"

      - name: Test
        run: dotnet test DiskSpaceMon.slnx -c Release --nologo

      # Four downloads: two architectures, and for each the choice between a small folder that
      # needs the .NET 10 runtime installed and one executable with the runtime bundled inside it
      # that needs nothing at all. The csproj turns a self-contained publish into that single
      # compressed file, so there is nothing to pass here beyond the switch.
      #
      # arm64 is cross-published from this x64 runner. Nothing is compiled natively, so the
      # output is a real ARM64 binary; it simply cannot be run here to prove it.
      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          foreach ($rid in 'win-x64', 'win-arm64') {
            foreach ($flavour in 'framework-dependent', 'portable') {
              $selfContained = if ($flavour -eq 'portable') { 'true' } else { 'false' }

              dotnet publish src/DiskSpaceMon/DiskSpaceMon.csproj `
                -c Release -r $rid --self-contained $selfContained `
                -p:Version=$env:VERSION `
                -o "publish/$rid-$flavour"

              # A failing dotnet does not stop a PowerShell loop on its own, and a silently empty
              # publish would be packaged and released as though it worked.
              if ($LASTEXITCODE -ne 0) { throw "publish failed: $rid $flavour" }
            }
          }

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null

          foreach ($build in Get-ChildItem publish -Directory) {
            # So whoever unzips it on a server has the settings reference and the licence to hand.
            Copy-Item README.md, LICENSE $build.FullName

            $zip = "dist/DiskSpaceMon-$env:VERSION-$($build.Name).zip"
            Compress-Archive -Path "$($build.FullName)/*" -DestinationPath $zip
            Write-Host "$zip  $([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB"
          }

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "DiskSpaceMon ${{ steps.version.outputs.version }}"
          --generate-notes
          ${{ steps.version.outputs.prerelease }}
          dist/*.zip
