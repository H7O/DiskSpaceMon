<!DOCTYPE html>
<!--
  Recovery notice, sent once when a volume climbs back above its threshold.
  Rows come from recovery-rows.html; the values a template can use are in the README.
-->
<html lang="en">
<head><meta charset="utf-8" /></head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:Segoe UI,Helvetica,Arial,sans-serif;color:#1f2328;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f7;padding:24px 12px;">
    <tr>
      <td align="center">

        <table role="presentation" width="640" cellpadding="0" cellspacing="0" border="0" style="max-width:640px;width:100%;background-color:#ffffff;border:1px solid #d8dce0;border-radius:6px;">

          <tr>
            <td style="background-color:#1a7f47;color:#ffffff;padding:16px 24px;border-radius:6px 6px 0 0;">
              <div style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;">{html{appName}} recovered</div>
              <div style="font-size:20px;font-weight:600;padding-top:2px;">Disk space recovered on {html{machineName}}</div>
            </td>
          </tr>

          <tr>
            <td style="padding:20px 24px 8px 24px;font-size:14px;line-height:1.5;">
              {html{summary}} on <strong>{html{machineName}}</strong>. No further action is needed.
            </td>
          </tr>

          <tr>
            <td style="padding:8px 24px 20px 24px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-size:13px;">
                <tr>
                  <th align="left" style="padding:8px 10px;background-color:#f0f1f3;border-bottom:2px solid #d8dce0;font-weight:600;">Volume</th>
                  <th align="right" style="padding:8px 10px;background-color:#f0f1f3;border-bottom:2px solid #d8dce0;font-weight:600;">Free</th>
                  <th align="right" style="padding:8px 10px;background-color:#f0f1f3;border-bottom:2px solid #d8dce0;font-weight:600;">Capacity</th>
                  <th align="left" style="padding:8px 10px;background-color:#f0f1f3;border-bottom:2px solid #d8dce0;font-weight:600;">Threshold</th>
                </tr>
                <h-embedded-template><![CDATA[{uri{.}}/recovery-rows.html]]></h-embedded-template>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:12px 24px;border-top:1px solid #e6e8eb;font-size:12px;color:#6b7280;border-radius:0 0 6px 6px;">
              {html{appName}} on {html{machineName}} &middot; {html{generatedAt}}
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
