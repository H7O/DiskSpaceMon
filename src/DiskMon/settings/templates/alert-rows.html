<!--
  One table row per volume below its threshold. Everything after the block below repeats once
  per volume. The list of values a row can use is in the README, under "Email templates". It is
  not repeated here because this file is a template, and a marker written in a comment is
  still a marker: it would be substituted and the value shipped in the email.
-->
<h-embedded-data content-type="model"><![CDATA[disks]]></h-embedded-data>
<tr data-volume="{html{path}}">
  <td style="padding:10px;border-bottom:1px solid #e6e8eb;vertical-align:top;">
    <div style="font-weight:600;">{html{name}}</div>
    <div style="color:#6b7280;font-size:12px;">{html{path}}</div>
  </td>
  <td align="right" style="padding:10px;border-bottom:1px solid #e6e8eb;vertical-align:top;white-space:nowrap;">
    <div style="font-weight:600;color:#b42318;">{html{free}}</div>
    <div style="color:#6b7280;font-size:12px;">{html{freePercent}} free</div>
  </td>
  <td align="right" style="padding:10px;border-bottom:1px solid #e6e8eb;vertical-align:top;white-space:nowrap;">
    <div>{html{total}}</div>
    <div style="color:#6b7280;font-size:12px;">{html{usedPercent}} used</div>
  </td>
  <td style="padding:10px;border-bottom:1px solid #e6e8eb;vertical-align:top;">
    <div>{html{reason}}</div>
    <div style="color:#6b7280;font-size:12px;">Threshold {html{threshold}} &middot; {html{state}} &middot; low for {html{lowFor}}</div>
  </td>
</tr>
